name: Test

on: workflow_call
env:
  SECRET_KEY: "TEST_KEY"


jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.13'
        cache: 'pip' # caching pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements/generated/requirements-development.txt

    - name: Unit test with pytest
      run: |
        pip install pytest pytest-cov
        coverage run -m pytest tests/unit_tests
        coverage xml

    - name: Upload coverage report
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: coverage-xml-report
        path: coverage.xml

  e2e_test:
    name: E2E Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.12.0'
          cache: 'npm'
  
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/generated/requirements-development.txt
  
      - name: Install Node dependencies
        run: npm install
  
      - name: Build frontend assets
        run: npm run build
  
      - name: Install Playwright browsers
        run: npx playwright install
       
      - name: Start Flask app
        run: python -m flask run --port 8020 &
        env:
          FLASK_APP: app:create_app
          ENTRA_ID_SKIP_AUTH: True
          SECRET_KEY: TEST_KEY
          REDIS_URL: redis://localhost:6379/0
          PDA_USE_MOCK_API: True
          PDA_URL: https://mock-api.example.com
          PDA_API_KEY: mock-api-key
          PDA_ENVIRONMENT: Mock

      - name: Wait for Flask app to start
        run: |
          for i in {1..30}; do
            curl http://localhost:8020 && break || sleep 1
          done  
  
      - name: Run E2E tests with Cucumber
        run: npm run test:e2e:cucumber

      - name: Upload Cucumber test report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-cucumber-report
          path: e2e/test-results/
        if: ${{ always() }}
